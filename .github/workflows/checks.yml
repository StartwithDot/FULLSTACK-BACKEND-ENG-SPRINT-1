name: Cohort checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  starter:
    name: Starter checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:check
      - run: npm run check

  database:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cohort
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: merchantdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cohort -d merchantdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cohort:disposable_ci_only@localhost:5432/merchantdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:db
